plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.moneyprinter.mobile"
    compileSdk flutter.compileSdkVersion
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.moneyprinter.mobile"
        // ffmpeg_kit_flutter requires minSdkVersion 24 (Android 7.0+)
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    // Reduce APK size: keep only arm64-v8a and armeabi-v7a (covers 99%+ of devices)
    splits {
        abi {
            enable false // set true to create per-ABI APKs for Play Store
        }
    }

    // Required by ffmpeg_kit_flutter and some audio libraries
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfbjni.so'
    }
}

flutter {
    source "../.."
}
