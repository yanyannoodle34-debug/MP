name: money_printer_mobile
description: AI-powered short video generator — runs fully on-device (Android).
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Video processing — full GPL build includes x264, libass (subtitles), fdk-aac
  ffmpeg_kit_flutter_full_gpl: ^6.0.3

  # HTTP client
  dio: ^5.11.0

  # On-device TTS → audio file via synthesizeToFile()
  flutter_tts: ^4.2.5

  # Video playback
  video_player: ^2.8.7
  chewie: ^1.10.0

  # File system / paths
  path_provider: ^2.1.4

  # Runtime permissions
  permission_handler: ^11.3.1

  # State management
  provider: ^6.1.5

  # Persistent settings (API keys, preferences)
  shared_preferences: ^2.2.2

  # Save to gallery / share
  saver_gallery: ^4.1.2
  share_plus: ^12.0.2

  # Unique IDs for tasks
  uuid: ^4.6.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bgm/
