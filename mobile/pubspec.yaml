name: money_printer_mobile
description: CloudAI Creator — cloud AI script/image/voice, on-device video render.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Video processing (full GPL build: x264, libass subtitles, fdk-aac)
  ffmpeg_kit_flutter_full_gpl: ^6.0.3

  # HTTP client
  dio: ^5.4.3

  # Video playback
  video_player: ^2.8.7
  chewie: ^1.8.5

  # File system / paths
  path_provider: ^2.1.4

  # Runtime permissions
  permission_handler: ^11.3.1

  # State management
  provider: ^6.1.2

  # Persistent settings (API keys, preferences)
  shared_preferences: ^2.2.2

  # Save to gallery / share
  saver_gallery: ^4.0.1
  share_plus: ^10.1.4

  # Unique IDs for tasks
  uuid: ^4.5.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Force older versions compatible with Flutter 3.24.5's Gradle plugin.
# wakelock_plus (pulled by chewie) → package_info_plus.
# package_info_plus 9.x uses flutter.compileSdkVersion Gradle extension
# that only exists in Flutter 3.27+. Pinning to 8.x keeps the old style.
dependency_overrides:
  wakelock_plus: 1.3.3
  package_info_plus: 8.3.1

flutter:
  uses-material-design: true
