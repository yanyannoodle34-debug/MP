name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ─────────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Android SDK ───────────────────────────────────────────────────────────
      # GitHub-hosted ubuntu-latest runners ship the Android SDK at:
      # /usr/local/lib/android/sdk  (ANDROID_SDK_ROOT env var is already set)
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK (required by ffmpeg_kit_flutter)
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.1.8937393" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            --sdk_root=$ANDROID_SDK_ROOT

      # ── Flutter ───────────────────────────────────────────────────────────────
      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Install pub dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi
          echo "=== APK files ==="
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      # ── Rename APK ────────────────────────────────────────────────────────────
      - name: Rename APK for release
        working-directory: mobile
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "MoneyPrinterMobile-v${VERSION}-arm64.apk" || \
          cp build/app/outputs/flutter-apk/app-release.apk \
             "MoneyPrinterMobile-v${VERSION}.apk"
          ls -lh MoneyPrinterMobile*.apk

      # ── Upload build artifact ─────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterMobile-apk
          path: mobile/MoneyPrinterMobile*.apk
          retention-days: 30

      # ── GitHub Release ────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version || '1.0.0' }}"
          name: "MoneyPrinterMobile v${{ github.event.inputs.version || '1.0.0' }}"
          body: |
            ## MoneyPrinterMobile — Android APK

            AI-powered short video generator running **100% locally on Android** (API 24+).

            ### Installation
            1. Download `MoneyPrinterMobile-v*-arm64.apk` below (arm64 — covers all modern Android phones)
            2. On your Android device: **Settings → Security → Install unknown apps** → enable for your browser/file manager
            3. Open the downloaded APK to install

            ### First run
            1. Tap ⚙ Settings
            2. Enter your [OpenRouter API key](https://openrouter.ai/keys) (free tier available)
            3. Enter your [Pexels API key](https://www.pexels.com/api/) (free)
            4. Enter a topic on the home screen → tap **Generate Video**

            ### Pipeline (on-device)
            ```
            Topic → LLM (script + search terms)
                  → Pexels API (stock clips downloaded to device)
                  → on-device TTS (audio synthesis)
                  → FFmpeg (concat + subtitles + encode → MP4)
                  → Save to gallery / Share
            ```

            ### Requirements
            - Android 7.0+ (API 24), arm64 device
            - Internet for API calls (LLM + Pexels); all processing is on-device
          files: mobile/MoneyPrinterMobile*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
