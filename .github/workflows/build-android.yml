name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

# Required so the built-in GITHUB_TOKEN can create a GitHub Release
# and upload the APK asset (default is contents:read only).
permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/claude-md-docs-2lkbdz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK and platforms
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.1.8937393" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "platforms;android-35" \
            --sdk_root=$ANDROID_SDK_ROOT

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install pub dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Rename APK for release
        working-directory: mobile
        run: |
          VERSION="${{ github.event.inputs.version || '1.0.0' }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "CloudAICreator-v${VERSION}-arm64.apk" 2>/dev/null || \
          cp build/app/outputs/flutter-apk/app-release.apk \
             "CloudAICreator-v${VERSION}.apk"
          ls -lh CloudAICreator*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudAICreator-apk
          path: mobile/CloudAICreator*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version || '1.0.0' }}"
          name: "CloudAI Creator v${{ github.event.inputs.version || '1.0.0' }}"
          body: |
            ## CloudAI Creator — Android APK

            AI video creator that generates **script + images + voice through cloud APIs**
            and **renders the video on your device** with FFmpeg.

            You provide your own API keys inside the app. Keys are stored locally in
            SharedPreferences and never leave the device except to call the provider you selected.

            ### Installation
            1. Download `CloudAICreator-v*-arm64.apk` below (arm64 — modern Android phones)
            2. On device: **Settings → Security → Install unknown apps** → enable for your browser
            3. Open the APK to install

            ### First run
            1. Tap ⚙ Settings
            2. Pick providers and enter your keys:
               - **LLM (script)**: OpenRouter | OpenAI
               - **Image**: DALL-E 3 | Stability AI | fal.ai Flux
               - **Voice**: ElevenLabs | OpenAI TTS
            3. Enter topic → **Generate Video**

            ### Pipeline
            ```
            Topic → LLM (per-scene narration + image prompt)
                  → Cloud Image API (one 9:16 image per scene)
                  → Cloud TTS API (one audio clip per scene)
                  → FFmpeg on-device:
                      · image + audio + ken-burns zoom = scene clip
                      · concat all scenes
                      · burn subtitles
                      · encode → MP4
                  → Save to gallery / Share
            ```

            ### Requirements
            - Android 7.0+ (API 24), arm64
            - Internet for cloud API calls; rendering is on-device
          files: mobile/CloudAICreator*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
